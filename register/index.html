<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#060a15">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="robots" content="noindex">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; frame-src 'none'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; upgrade-insecure-requests">
  <title>Create account | LSPD</title>
  <link rel="icon" type="image/png" href="../assets/favicon.png">
  <link rel="preconnect" href="https://cydsusnowotmorxywyxa.supabase.co" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="../css/app.css">
  <script src="../lspd-config.js" data-auth></script>
</head>
<body class="auth" data-auth-mode="register">
  <div class="backdrop" aria-hidden="true"></div>
  <main class="auth-card glass-strong">
    <a class="auth-mark" href="../" aria-label="Hub"><img src="../assets/shield.webp" width="67" height="96" alt=""></a>
    <p class="kicker" data-t="registerKicker">LSPD // New account</p>
    <h1 data-t="registerTitle">Create account</h1>
    <form id="authForm" class="auth-form" novalidate>
      <label class="field"><span data-t="name">Display name</span><input id="authName" type="text" autocomplete="nickname" maxlength="60" required></label>
      <label class="field"><span data-t="email">Email</span><input id="authEmail" type="email" autocomplete="email" required></label>
      <label class="field"><span data-t="password">Password</span><input id="authPassword" type="password" autocomplete="new-password" required></label>
      <button class="btn btn-red btn-lg" id="authSubmit" type="submit" data-t="register">Create account</button>
    </form>
    <button class="btn btn-discord btn-lg" id="authDiscord" type="button"><svg class="i"><use href="../assets/icons.svg#i-discord"/></svg><span data-t="discord">Continue with Discord</span></button>
    <p class="auth-status" id="authStatus" role="status" aria-live="polite"></p>
    <div class="auth-links"><a href="../login/" data-t="toLogin">Login</a><a href="../" data-t="back">Back to hub</a></div>
  </main>
  <script src="../auth-branch.js"></script>
</body>
</html>
